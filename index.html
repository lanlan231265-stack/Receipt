<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台灣發票單據 OCR 記帳助理 (YYYY/MM/DD 格式)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- SheetJS CDN (處理 .xlsx 下載) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- 標題與設定區 -->
    <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="receipt-text" class="text-blue-600"></i>
          發票與單據 OCR 記帳助理
        </h1>
        <p class="text-sm text-slate-500 mt-1">
          西元日期 YYYY/MM/DD ‧ 單據總金額入帳 ‧ 拍一張即時顯示一張
        </p>
      </div>

      <!-- API Key、模型與目標統編設定 -->
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
        <div class="flex items-center gap-2 bg-slate-100 px-3 py-2 rounded-xl text-sm border border-slate-200">
          <span class="text-slate-500 font-medium">模型:</span>
          <select id="modelSelect" class="bg-transparent font-medium text-slate-800 outline-none text-xs">
            <option value="gemini-3.6-flash" selected>Gemini 3.6 Flash</option>
            <option value="gemini-3.6-pro">Gemini 3.6 Pro</option>
          </select>
        </div>
        <div class="flex items-center gap-2 bg-slate-100 px-3 py-2 rounded-xl text-sm border border-slate-200">
          <span class="text-slate-500 font-medium">目標統編:</span>
          <input id="targetTaxId" type="text" value="20088708" class="w-24 bg-transparent font-mono font-bold text-blue-700 outline-none" />
        </div>
        <input 
          id="apiKeyInput" 
          type="password" 
          placeholder="輸入 Gemini API Key" 
          class="px-3 py-2 rounded-xl text-sm border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
    </header>

    <!-- 操作區：拍照與檔案上傳 -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <!-- 拍照按鈕卡片 -->
        <div class="border border-slate-200 bg-blue-50/40 rounded-xl p-5 flex flex-col justify-between items-center text-center gap-3">
          <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center">
            <i data-lucide="camera" class="w-6 h-6"></i>
          </div>
          <div>
            <h3 class="font-bold text-slate-900">即時拍照辨識</h3>
            <p class="text-xs text-slate-500 mt-1">拍一張、畫面即時帶入該張總額明細</p>
          </div>
          <button id="startCameraBtn" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl flex items-center justify-center gap-2 transition">
            <i data-lucide="video" class="w-4 h-4"></i> 開啟相機鏡頭
          </button>
        </div>

        <!-- 檔案拖曳上傳 -->
        <div 
          id="dropZone" 
          class="border-2 border-dashed border-slate-300 hover:border-blue-500 bg-slate-50 hover:bg-blue-50/20 transition-colors rounded-xl p-5 flex flex-col items-center justify-center cursor-pointer text-center"
        >
          <i data-lucide="upload-cloud" class="w-10 h-10 text-slate-400 mb-1"></i>
          <p class="text-slate-700 font-medium text-sm">選擇或拖曳單據檔案 / PDF</p>
          <p class="text-xs text-slate-400 mt-1">支援水電帳單、發票圖檔、PDF</p>
          <input id="fileInput" type="file" multiple accept="image/*,application/pdf" class="hidden" />
        </div>

      </div>

      <!-- 相機即時視窗 (預設隱藏) -->
      <div id="cameraModal" class="hidden border border-slate-300 bg-slate-900 p-4 rounded-xl flex flex-col items-center gap-3">
        <video id="videoPreview" autoplay playsinline class="w-full max-w-md max-h-72 object-cover rounded-lg bg-black"></video>
        <canvas id="photoCanvas" class="hidden"></canvas>
        <div class="flex gap-3">
          <button id="captureBtn" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg flex items-center gap-2 shadow-sm transition">
            <i data-lucide="aperture" class="w-4 h-4"></i> 拍照並辨識
          </button>
          <button id="closeCameraBtn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm transition">
            關閉相機
          </button>
        </div>
      </div>

      <div id="statusAlert" class="hidden text-sm p-3 rounded-xl"></div>
    </section>

    <!-- 最新即時卡片提示 -->
    <section id="latestItemCard" class="hidden bg-blue-50/80 border border-blue-200 p-4 rounded-2xl flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold">
          新
        </div>
        <div>
          <div class="text-xs text-blue-600 font-semibold">剛辨識成功的新單據</div>
          <div id="latestItemText" class="text-sm font-bold text-slate-900 mt-0.5"></div>
        </div>
      </div>
      <div id="latestItemMeta" class="text-right font-mono"></div>
    </section>

    <!-- 結果表格區 -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <h2 class="text-lg font-bold text-slate-900">核銷明細彙整</h2>
          <span id="recordCount" class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded-full font-medium">0 筆資料</span>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <!-- 存成所有資料 Excel 按鈕 -->
          <button id="downloadXlsxBtn" class="px-3.5 py-2 text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg flex items-center gap-1.5 shadow-sm transition">
            <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> 存成所有資料 Excel (.xlsx)
          </button>
          <button id="copyExcelBtn" class="px-3 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg flex items-center gap-1.5 transition">
            <i data-lucide="copy" class="w-4 h-4"></i> 複製貼上版
          </button>
          <button id="copyMdBtn" class="px-3 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg flex items-center gap-1.5 transition">
            <i data-lucide="clipboard-copy" class="w-4 h-4"></i> 複製 Markdown
          </button>
          <button id="clearBtn" class="px-3 py-1.5 text-xs font-medium bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 rounded-lg flex items-center gap-1.5 transition">
            <i data-lucide="trash-2" class="w-4 h-4"></i> 清空
          </button>
        </div>
      </div>

      <!-- 表格容器 -->
      <div class="overflow-x-auto border border-slate-200 rounded-xl">
        <table class="w-full text-left text-sm border-collapse">
          <thead>
            <tr class="bg-slate-100 text-slate-700 border-b border-slate-200">
              <th class="p-3 font-semibold">日期</th>
              <th class="p-3 font-semibold">品名</th>
              <th class="p-3 font-semibold text-right">金額</th>
              <th class="p-3 font-semibold">統編檢查</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100 font-mono">
            <tr>
              <td colspan="4" class="p-8 text-center text-slate-400 font-sans">尚未拍攝或上傳任何單據</td>
            </tr>
          </tbody>
          <tfoot class="bg-slate-50 border-t border-slate-200 font-bold">
            <tr>
              <td colspan="2" class="p-3 text-slate-700 font-sans">累積總金額</td>
              <td id="totalAmount" class="p-3 text-right font-mono text-blue-700 text-base">NT$ 0</td>
              <td class="p-3"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </section>
  </div>

  <script>
    lucide.createIcons();

    let records = [];
    let mediaStream = null;

    const apiKeyInput = document.getElementById('apiKeyInput');
    const modelSelect = document.getElementById('modelSelect');
    const targetTaxIdInput = document.getElementById('targetTaxId');
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const statusAlert = document.getElementById('statusAlert');
    const tableBody = document.getElementById('tableBody');
    const totalAmountEl = document.getElementById('totalAmount');
    const recordCountEl = document.getElementById('recordCount');
    
    // 相機元件
    const startCameraBtn = document.getElementById('startCameraBtn');
    const closeCameraBtn = document.getElementById('closeCameraBtn');
    const captureBtn = document.getElementById('captureBtn');
    const cameraModal = document.getElementById('cameraModal');
    const videoPreview = document.getElementById('videoPreview');
    const photoCanvas = document.getElementById('photoCanvas');

    // 即時提示元件
    const latestItemCard = document.getElementById('latestItemCard');
    const latestItemText = document.getElementById('latestItemText');
    const latestItemMeta = document.getElementById('latestItemMeta');

    apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
    apiKeyInput.addEventListener('change', () => localStorage.setItem('gemini_api_key', apiKeyInput.value.trim()));

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-blue-500', 'bg-blue-50/50'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-blue-500', 'bg-blue-50/50'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-blue-500', 'bg-blue-50/50');
      if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) handleFiles(fileInput.files);
    });

    // 開啟相機
    startCameraBtn.addEventListener('click', async () => {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        videoPreview.srcObject = mediaStream;
        cameraModal.classList.remove('hidden');
        showStatus('相機已啟動，請對準單據按【拍照並辨識】');
      } catch (err) {
        showStatus(`無法啟動相機: ${err.message}`, true);
      }
    });

    // 關閉相機
    function stopCamera() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      cameraModal.classList.add('hidden');
    }
    closeCameraBtn.addEventListener('click', stopCamera);

    // 拍照並辨識
    captureBtn.addEventListener('click', () => {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        showStatus('請先在右上角輸入 Gemini API Key', true);
        apiKeyInput.focus();
        return;
      }

      photoCanvas.width = videoPreview.videoWidth;
      photoCanvas.height = videoPreview.videoHeight;
      const ctx = photoCanvas.getContext('2d');
      ctx.drawImage(videoPreview, 0, 0, photoCanvas.width, photoCanvas.height);
      
      const dataUrl = photoCanvas.toDataURL('image/jpeg', 0.85);
      const base64Data = dataUrl.split(',')[1];

      processPayloads([{ mimeType: 'image/jpeg', data: base64Data }]);
    });

    function showStatus(text, isError = false, isLoading = false) {
      statusAlert.className = `text-sm p-3 rounded-xl flex items-center gap-2 ${
        isError ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-blue-50 text-blue-700 border border-blue-200'
      }`;
      statusAlert.innerHTML = `${isLoading ? '<span class="animate-spin inline-block mr-2">🌀</span>' : ''}${text}`;
      statusAlert.classList.remove('hidden');
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve({
          mimeType: file.type || 'image/jpeg',
          data: reader.result.split(',')[1]
        });
        reader.onerror = error => reject(error);
      });
    }

    async function handleFiles(files) {
      const payloads = await Promise.all(Array.from(files).map(f => fileToBase64(f)));
      processPayloads(payloads);
    }

    async function processPayloads(filePayloads) {
      const apiKey = apiKeyInput.value.trim();
      const selectedModel = modelSelect.value || 'gemini-3.6-flash';

      if (!apiKey) {
        showStatus('請先在右上角輸入 Gemini API Key', true);
        apiKeyInput.focus();
        return;
      }

      showStatus(`正在使用 ${selectedModel} 辨識單據...`, false, true);

      try {
        const targetTaxId = targetTaxIdInput.value.trim() || '20088708';

        const prompt = `你是一位專門處理台灣各類發票、免用統一發票收據、水電費、電話費、手寫計程車證明、估價單與各類單據的 OCR 記帳助理。

【核心任務】
每張單據請輸出一筆資料（以該張單據的【總金額】入帳，不要拆解細項）。一張圖片若貼有多張獨立單據，請按單據數量輸出對應筆數。

【品名與期間規則】
1. 電費、水費、電話費規則：
   - 只能寫「電費」、「水費」、「電話費」，嚴禁出現機構或公司名稱（不要寫台電、台灣電力公司、台水、自來水公司、中華電信、遠傳、台灣大哥大等）。
   - 後方直接用括號附上起訖期間，【嚴禁出現「計費期間：」這五個字】。
   - 格式範例：
     * 電費 (2026/06/15-2026/08/14)
     * 水費 (2026/05-2026/07)
     * 電話費 (2026/07)
2. 一般發票/收據：品名請自動歸納並撰寫為適當的報帳類別（例如：「文具一批」、「餐費」、「差旅費 (計程車)」、「辦公用品一批」等）。

【指定買受人統編核銷規則】
- 目標統編：${targetTaxId}
- 若為統一發票（電子發票證明聯、二/三聯式發票）：
  * 買受人統編為 ${targetTaxId} -> status: "✅ 正確"
  * 買受人統編非 ${targetTaxId} 或未打統編 -> status: "❌ 錯誤 (實際統編/未打)"
- 若為水電費、電話費收據、免用統一發票收據、手寫計程車證明、個人領據等公用或免用單據：
  * status: "— (免用)" 或 "— (公用事業)"

【欄位輸出原則】
- date: 單據開立日期或繳費日期，西元格式「YYYY/MM/DD」（例如 2026/08/24。若無年份依當年度推算；若無日期填空字串 ""）。
- item: 依上述品名規則整理（例如：「電費 (2026/06/15-2026/08/14)」、「文具一批」）。
- amount: 該張單據之「實付總金額 / 應繳總額」（純阿拉伯數字整數）。
- status: 依上述核銷規則輸出文字。

請直接回傳 JSON 格式陣列：
[
  { "date": "2026/08/24", "item": "電費 (2026/06/15-2026/08/14)", "amount": 3450, "status": "— (公用事業)" },
  { "date": "2026/08/24", "item": "文具一批", "amount": 520, "status": "✅ 正確" }
]`;

        const contents = [{
          role: "user",
          parts: [
            ...filePayloads.map(p => ({ inline_data: { mime_type: p.mimeType, data: p.data } })),
            { text: prompt }
          ]
        }];

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents,
            generationConfig: {
              responseMimeType: "application/json"
            }
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const rawText = data.candidates[0].content.parts[0].text;
        const newItems = JSON.parse(rawText);

        if (Array.isArray(newItems) && newItems.length > 0) {
          records = [...records, ...newItems];
          renderTable();
          
          // 更新最新一筆即時卡片
          const lastItem = newItems[newItems.length - 1];
          latestItemText.innerText = `${lastItem.item} (${lastItem.date || '無日期'})`;
          latestItemMeta.innerHTML = `<div class="text-emerald-600 font-bold text-base">NT$ ${Number(lastItem.amount).toLocaleString()}</div><div class="text-xs text-slate-500">${lastItem.status}</div>`;
          latestItemCard.classList.remove('hidden');

          showStatus(`成功辨識並新增 ${newItems.length} 張單據總額！可繼續拍照或點選下方匯出 Excel。`);
        } else {
          showStatus('未能從圖片辨識到單據內容，請再拍一張清晰的照片', true);
        }
      } catch (err) {
        showStatus(`辨識失敗: ${err.message}`, true);
      } finally {
        fileInput.value = '';
      }
    }

    function renderTable() {
      recordCountEl.innerText = `${records.length} 筆資料`;
      if (records.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-400 font-sans">尚未拍攝或上傳任何單據</td></tr>`;
        totalAmountEl.innerText = 'NT$ 0';
        latestItemCard.classList.add('hidden');
        return;
      }

      let total = 0;
      tableBody.innerHTML = records.map((r) => {
        const amt = Number(r.amount) || 0;
        total += amt;
        return `
          <tr class="hover:bg-slate-50/80 transition">
            <td class="p-3 text-slate-600">${r.date || '—'}</td>
            <td class="p-3 text-slate-900 font-sans">${r.item}</td>
            <td class="p-3 text-right font-medium text-slate-900">${amt.toLocaleString()}</td>
            <td class="p-3">${r.status}</td>
          </tr>
        `;
      }).join('');

      totalAmountEl.innerText = `NT$ ${total.toLocaleString()}`;
    }

    // 匯出全部資料為 Excel (.xlsx)
    document.getElementById('downloadXlsxBtn').addEventListener('click', () => {
      if (records.length === 0) {
        alert('目前尚無資料可供匯出，請先拍照或上傳單據！');
        return;
      }

      let total = 0;
      const exportData = [
        ["日期", "品名", "金額", "統編檢查"]
      ];

      records.forEach(r => {
        const amt = Number(r.amount) || 0;
        total += amt;
        exportData.push([r.date || '', r.item, amt, r.status]);
      });

      // 結算列
      exportData.push(["累積總金額", "", total, ""]);

      const ws = XLSX.utils.aoa_to_sheet(exportData);
      ws['!cols'] = [
        { wch: 14 },
        { wch: 40 },
        { wch: 12 },
        { wch: 22 }
      ];

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "全部核銷明細");

      const todayStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
      XLSX.writeFile(wb, `單據核銷總表_${todayStr}.xlsx`);
    });

    // 複製至 Excel (TSV)
    document.getElementById('copyExcelBtn').addEventListener('click', () => {
      if (records.length === 0) return;
      let tsv = `日期	品名	金額	統編檢查
`;
      let total = 0;
      records.forEach(r => {
        const amt = Number(r.amount) || 0;
        total += amt;
        tsv += `${r.date || ''}	${r.item}	${amt}	${r.status}
`;
      });
      tsv += `累積總金額		${total}	
`;
      navigator.clipboard.writeText(tsv).then(() => alert('已複製所有明細！可直接在 Excel 中貼上。'));
    });

    // 複製 Markdown
    document.getElementById('copyMdBtn').addEventListener('click', () => {
      if (records.length === 0) return;
      let md = `| 日期 | 品名 | 金額 | 統編檢查 |
|---|---|---|---|
`;
      let total = 0;
      records.forEach(r => {
        const amt = Number(r.amount) || 0;
        total += amt;
        md += `| ${r.date || ''} | ${r.item} | ${amt} | ${r.status} |
`;
      });
      md += `
**累積總金額：${total}**`;
      navigator.clipboard.writeText(md).then(() => alert('已複製 Markdown 格式！'));
    });

    // 清空
    document.getElementById('clearBtn').addEventListener('click', () => {
      if (confirm('確定要清空所有已辨識的資料嗎？')) {
        records = [];
        renderTable();
        statusAlert.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
